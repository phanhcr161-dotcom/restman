# Cấu hình cổng chạy ứng dụng
server.port=8080

# Cấu hình kết nối cơ sở dữ liệu MySQL 
# (Thay 'restman_db' thành tên database của bạn, 'root' thành tài khoản và mật khẩu MySQL của bạn)
spring.datasource.url=jdbc:mysql://localhost:3306/restman_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=100125

# Cấu hình Hibernate / JPA (Tự động cập nhật bảng dựa trên các Entity bạn đã viết)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect